version: '3.8'

services:
  hooper-two:
    build: .
    container_name: hooper-two-bot
    restart: unless-stopped
    env_file:
    volumes:
      # Persist database and images
      - ./data:/app/data
      # Persist backups
      - ./backups:/app/backups
    networks:
      - hooper-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; sqlite3.connect('data/hooper_two.db').execute('SELECT 1')"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  hooper-network:
    driver: bridge
