version: '3.8'

services:
  hooper-two:
    build: .
    container_name: hooper-two-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist database and images
      - ./data:/app/data
      # Persist backups
      - ./backups:/app/backups
    networks:
      - hooper-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hooper-network:
    driver: bridge
