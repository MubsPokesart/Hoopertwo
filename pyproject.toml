[tool.poetry]
name = "hooper-two"
version = "0.1.0"
description = "NBA player collection Discord bot"
authors = ["Your Name <you@example.com>"]
packages = [
    { include = "src" }
]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
"discord.py" = "^2.3.2"
python-dotenv = "^1.0.0"
aiohttp = "^3.9.0"
pillow = "^10.1.0"
requests = "^2.31.0"
nodriver = "^0.34"
beautifulsoup4 = "^4.12.0"
websockets = "13.1"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
ruff = "^0.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
